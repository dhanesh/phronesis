# SonarQube / SonarCloud analysis settings. Used by the sonar job in
# .github/workflows/security.yml and by a local scan (docs/security-scans.md).
sonar.projectKey=phronesis
sonar.projectName=phronesis
sonar.sources=cmd,internal,frontend/src,deploy
sonar.tests=internal,frontend/tests
sonar.test.inclusions=**/*_test.go,frontend/tests/**
sonar.exclusions=**/*_test.go,internal/webfs/dist/**,frontend/dist/**,**/node_modules/**,**/testdata/**
sonar.go.coverage.reportPaths=coverage.out
sonar.sourceEncoding=UTF-8
