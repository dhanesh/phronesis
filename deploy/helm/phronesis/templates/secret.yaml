{{- if not .Values.auth.existingSecret }}
{{- $pw := required "auth.adminPassword is required (or set auth.existingSecret)" .Values.auth.adminPassword }}
{{- if eq $pw "admin123" }}{{ fail "auth.adminPassword must not be the built-in default" }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "phronesis.fullname" . }}
  labels: {{- include "phronesis.labels" . | nindent 4 }}
type: Opaque
stringData:
  admin-password: {{ $pw | quote }}
  {{- if .Values.oidc.enabled }}
  oidc-client-secret: {{ required "oidc.clientSecret is required when oidc.enabled (or use auth.existingSecret)" .Values.oidc.clientSecret | quote }}
  {{- end }}
{{- end }}
