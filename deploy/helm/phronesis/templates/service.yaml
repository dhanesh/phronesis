apiVersion: v1
kind: Service
metadata:
  name: {{ include "phronesis.fullname" . }}
  labels: {{- include "phronesis.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "phronesis.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
